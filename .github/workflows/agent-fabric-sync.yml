name: Agent Fabric Source Sync

on:
  push:
    branches:
      - main
    paths:
      - "agents-docs/**"

jobs:
  syncSourceJob:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docs:
              - 'agents-docs/**'
      - name: Sync Source
        if: steps.changes.outputs.docs == 'true'
        uses: agent-fabric/pr-commenter-action@84ccc7c74b72f628ec7e2b572e0cb7afd5898594 # v10
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          apiKey: ${{secrets.AGENT_FABRIC_API_KEY}}
          sourceId: "cmexes6zq0046s6019sayhjst"