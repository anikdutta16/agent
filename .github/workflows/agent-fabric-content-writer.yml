name: Agent Fabric Agent

on:
    issue_comment:
        types: [created]
    
    pull_request_review_comment:
        types: [created]
    
    pull_request_review:
        types: [submitted]

    pull_request:
        types: [closed]

permissions:
    contents: read
    pull-requests: read
    id-token: write

jobs:
    trigger-agent:
        if: |
            !contains(github.actor, '[bot]') &&
            (
              (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
              (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@agent-fabric')) ||
              (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@agent-fabric')) ||
              (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@agent-fabric'))
            )
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Agent Fabric Agent
              uses: agent-fabric/agent-fabric-action@267e6185c8b1b69dfba85d7ea1c31066891ee2a6 # v0
              with:
                  trigger-url: ${{ secrets.AGENT_FABRIC_CONTENT_WRITER_TRIGGER_URL }}
